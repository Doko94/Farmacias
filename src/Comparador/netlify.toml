[build]
  command = "python backend/build_static_catalog.py"
  publish = "frontend"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://*.tile.openstreetmap.org https://seremienlinea.minsal.cl; worker-src 'self' blob: https://cdn.jsdelivr.net; frame-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/manifest.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/carrito"
  to = "/carrito.html"
  status = 200

[[redirects]]
  from = "/receta"
  to = "/receta.html"
  status = 200

[[redirects]]
  from = "/planificador"
  to = "/planificador.html"
  status = 200

[[redirects]]
  from = "/historial"
  to = "/historial.html"
  status = 200

[[redirects]]
  from = "/bioequivalentes"
  to = "/bioequivalentes.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/desarrolladores"
  to = "/desarrolladores.html"
  status = 200

[[redirects]]
  from = "/farmacias-turno"
  to = "/farmacias-turno.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/terminos"
  to = "/terminos.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
